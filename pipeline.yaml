# cdcx pipeline plan.
# Applies to public.users; other tables pass through unchanged.

keys:
  public.users: [id]

tables:
  public.users:
    - type: select
      columns: [id, name, email, balance, active]
    - type: redact
      columns: [email]
    - type: cast
      column: balance
      to: float
    - type: map
      column: double_balance
      expr: "balance * 2"
    - type: filter
      op: eq
      column: active
      value: true

