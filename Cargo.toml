[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mohit-meena/relay"
readme = "README.md"

[workspace.dependencies]
cdcx-model = { path = "crates/cdcx-model" }
cdcx-pg = { path = "crates/cdcx-pg" }
cdcx-plan = { path = "crates/cdcx-plan" }
cdcx-engine = { path = "crates/cdcx-engine" }
cdcx-sink = { path = "crates/cdcx-sink" }
cdcx-state = { path = "crates/cdcx-state" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio-postgres = "0.7"

pgwire-replication = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
bytes = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
